name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVOXELFORGE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: ./build/voxelforge --benchmark --quick

      - name: Headless screenshot (Xvfb + Mesa llvmpipe)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/voxelforge --screenshot screenshot.png --debug --no-save
          test -s screenshot.png

      - name: Upload screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev xvfb libgl1-mesa-dri

      - name: Allow ThreadSanitizer memory mappings
        # Ubuntu 24.04 runners use 32 bits of mmap randomisation, which TSan cannot handle.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVOXELFORGE_WERROR=ON
          -DVOXELFORGE_${{ matrix.sanitizer }}=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

      - name: Game under the sanitizer (streaming, meshing, rendering)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Leak checking stays on for the unit tests; Mesa's driver allocations are not ours.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/voxelforge --screenshot sanitized.png \
            --frames 60 --render-distance 6 --width 640 --height 360 --no-save
          test -s sanitized.png
